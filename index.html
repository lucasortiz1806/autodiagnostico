<html lang="es">
<head>

<style>
:root{
  /* Una columna de celular. Tinta para abrir y revelar, Bata para responder; la barra violeta tapa y destaca. Un solo tema, por identidad de marca. */
  --tinta:#0E1A2B; --bata:#EEF1EF; --violeta:#5546E8; --salvia:#8FB5A3; --coral:#FF6B4A; --ambar:#E8A93B; --blanco:#FFFFFF;
  --tinta-suave:rgba(14,26,43,.72); --linea:rgba(14,26,43,.16); --bata-suave:rgba(238,241,239,.74);
  --display:"Bricolage Grotesque","Arial Black",system-ui,sans-serif;
  --cuerpo:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{margin:0;min-height:100%}
body{background:var(--bata);color:var(--tinta);font-family:var(--cuerpo);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
body.fondo-tinta{background:var(--tinta)}
button,input,select{font:inherit;color:inherit}
p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:0;text-wrap:balance}
h1:focus,h2:focus{outline:none}
:focus-visible{outline:3px solid var(--violeta);outline-offset:3px}
.oscura :focus-visible,.cta :focus-visible,.res-cab :focus-visible{outline-color:var(--blanco)}

.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.pantalla{flex:1;display:flex;flex-direction:column;gap:20px;padding:20px 20px 32px;background:var(--bata)}
.pantalla[hidden]{display:none}
.oscura{background:var(--tinta);color:var(--bata)}
.cab{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:30px}
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.04em;line-height:1}
.logo svg{width:26px;height:26px;flex:none}
.logo b{background:var(--violeta);color:var(--blanco);padding:.06em .16em .12em;border-radius:.16em;font-weight:800;margin-left:.04em}
.paso{font-size:14px;font-weight:700;color:var(--tinta-suave);font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--violeta)}
.oscura .eyebrow,.res-cab .eyebrow{color:var(--salvia)}
.barra{background:var(--violeta);color:var(--blanco);padding:0 .12em .04em;border-radius:.1em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.tapa{display:inline-block;height:1.05em;border-radius:.22em;background:var(--violeta);vertical-align:middle}

.btn{display:flex;align-items:center;justify-content:center;min-height:56px;padding:14px 20px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:18px;line-height:1.2;cursor:pointer;text-decoration:none;text-align:center;width:100%}
.btn-violeta{background:var(--violeta);color:var(--blanco)}
.btn-claro{background:var(--blanco);color:var(--tinta)}
.btn-borde{background:transparent;border-color:currentColor;color:inherit}
.txtbtn,.lnk{background:none;border:0;padding:12px 4px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer;align-self:flex-start;text-align:left}
.lnk{color:var(--blanco)}

/* Inicio */
.hero{display:flex;flex-direction:column;gap:18px;flex:1;justify-content:center;padding:8px 0}
.hero h1{font-size:clamp(38px,11.5vw,54px)}
.bajada{font-size:18px;color:var(--bata-suave)}
.muestra{border:1px solid rgba(238,241,239,.2);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.muestra-f{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.muestra-f.chico{font-weight:400;font-size:15px;color:var(--bata-suave)}
.tramos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tramos i{height:12px;border-radius:6px;background:rgba(238,241,239,.2)}
.letra{font-size:14px;color:var(--bata-suave)}
.firma{font-size:14px;font-weight:700;color:var(--salvia)}

/* Preguntas */
.q{font-size:clamp(25px,6.9vw,31px)}
.seg{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.seg i{height:6px;border-radius:3px;background:var(--linea)}
.seg i.ok{background:var(--violeta)}
.tarjeta{background:var(--blanco);border-radius:18px;padding:26px 20px;display:flex;flex-direction:column;gap:14px}
.apoyo{color:var(--tinta-suave)}
.resps{display:flex;flex-direction:column;gap:10px}
.resp{min-height:58px;padding:12px 18px;border-radius:12px;border:2px solid var(--tinta);background:var(--blanco);font-weight:700;font-size:18px;cursor:pointer;text-align:center}
.resp.sel{background:var(--tinta);color:var(--blanco)}
.resp.opc{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:66px;justify-content:center}
.resp.opc small{font-size:15px;font-weight:400;color:var(--tinta-suave)}
.resp.opc.sel small{color:var(--bata-suave)}

/* Captura */
#p-captura{padding:0;gap:0}
.cap-top{padding:20px 20px 24px;display:flex;flex-direction:column;gap:18px}
.cap-top h2{font-size:clamp(30px,8.6vw,38px)}
.hoja{background:var(--bata);color:var(--tinta);border-radius:22px 22px 0 0;padding:24px 20px 32px;flex:1}
form{display:flex;flex-direction:column;gap:16px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-weight:700;font-size:16px}
.opc-t{font-weight:400;color:var(--tinta-suave)}
.campo input,.campo select{min-height:54px;padding:12px 14px;border-radius:12px;border:2px solid var(--linea);background:var(--blanco);width:100%}
.campo input:focus,.campo select:focus{border-color:var(--violeta);outline:none}
.campo [aria-invalid="true"]{border-color:var(--tinta)}
.ayuda{font-size:14px;color:var(--tinta-suave)}
.err{font-size:15px;font-weight:700;border-left:4px solid var(--coral);padding-left:10px}
.err[hidden]{display:none}
.trampa{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.casilla{display:flex;gap:12px;align-items:flex-start;font-size:16px;cursor:pointer}
.casilla input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--violeta)}
.aviso{border-top:1px solid var(--linea);padding-top:16px;display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--tinta-suave)}
.aviso h3{font-family:var(--cuerpo);font-size:14px;letter-spacing:0;font-weight:700;color:var(--tinta)}
.aviso a{color:var(--violeta);font-weight:700}

/* Resultado */
.res-cab{background:var(--tinta);color:var(--bata);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.res-t{font-size:clamp(26px,7.2vw,32px)}
.nivel-n{position:relative;display:inline-block;font-family:var(--display);font-weight:800;letter-spacing:-.04em;font-size:clamp(46px,13.5vw,60px);line-height:1}
[data-nivel="preventivo"] .nivel-n{color:var(--salvia)}
[data-nivel="moderado"] .nivel-n{color:var(--ambar)}
[data-nivel="critico"] .nivel-n{color:var(--coral)}
[data-nivel="preventivo"] .tp{background:var(--salvia)}
[data-nivel="moderado"] .tm{background:var(--ambar)}
[data-nivel="critico"] .tc{background:var(--coral)}
.tr-etq{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:13px;color:var(--bata-suave);margin-top:-8px}
[data-nivel="preventivo"] .tr-etq span:nth-child(1),[data-nivel="moderado"] .tr-etq span:nth-child(2),[data-nivel="critico"] .tr-etq span:nth-child(3){color:var(--bata);font-weight:700}
.cuenta{font-weight:700;font-variant-numeric:tabular-nums}
.cubre{position:absolute;inset:-2px -4px;height:auto;transform-origin:right center;transition:transform .55s cubic-bezier(.7,0,.2,1)}
.cubre.fuera{transform:scaleX(0)}
.lectura{font-size:18px}
.sub{font-size:24px}
.sub.chico{font-size:19px}
.punto{background:var(--blanco);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.punto h3{font-size:22px}
.rev-t{position:relative;display:inline-block}
.tag{align-self:flex-start;background:var(--tinta);color:var(--coral);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:6px}
.tag.ciego{color:var(--salvia)}
.ciego-t{font-weight:700}
.norma{font-size:14px;font-weight:700;color:var(--tinta-suave)}
.otros{display:flex;flex-direction:column;gap:8px}
.otros ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.aclara{background:var(--salvia);color:var(--tinta);border-radius:14px;padding:16px 18px;font-weight:700}
.cta{background:var(--violeta);color:var(--blanco);border-radius:20px;padding:24px 20px;display:flex;flex-direction:column;gap:14px}
.cta h2{font-size:27px}
.cta .chica{font-size:14px;opacity:.9}
.pack{border-top:1px solid rgba(255,255,255,.32);padding-top:14px;display:flex;flex-direction:column;gap:12px}
.chip{align-self:flex-start;background:var(--tinta);color:var(--blanco);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:6px}
.reserva,.conf{display:flex;flex-direction:column;gap:10px}
.conf[hidden],.hecho[hidden]{display:none}
.conf{background:rgba(14,26,43,.28);border-radius:12px;padding:14px}
.hecho{font-weight:700;border-left:4px solid var(--salvia);padding-left:10px}
.comp{display:flex;flex-direction:column;gap:10px}
.comp .fila{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.comp .btn{min-height:50px;font-size:16px;padding:10px 12px}
.comp .hecho{word-break:break-all}
.cierre{font-family:var(--display);font-weight:800;letter-spacing:-.035em;line-height:1.08;font-size:28px;text-wrap:balance}
.letra2{font-size:14px;color:var(--tinta-suave)}

@media (prefers-reduced-motion:reduce){.cubre{transition:none}}

</style>
</head>

  <section class="pantalla" id="p-resultado" hidden></section>
</main>

  function variante(AD, perfilId) {
    for (var i = 0; i < AD.perfil.opciones.length; i++) {
      if (AD.perfil.opciones[i].id === perfilId) return AD.perfil.opciones[i].variante;
    }
    return "ind";
  }
  function perfil(AD, perfilId) {
    for (var i = 0; i < AD.perfil.opciones.length; i++) {
      if (AD.perfil.opciones[i].id === perfilId) return AD.perfil.opciones[i];
    }
    return AD.perfil.opciones[0];
  }
  /* Una respuesta marca exposición si es la de riesgo o «No estoy seguro» */
  function expuesta(pregunta, resp) { return resp === "ns" || resp === pregunta.riesgo; }
  function puntos(AD, resps) {
    var n = 0;
    for (var i = 0; i < AD.preguntas.length; i++) { if (expuesta(AD.preguntas[i], resps[i])) n++; }
    return n;
  }
  /* Riesgo 0–100 para la columna K del CRM (bajo < 30, medio 30–59, alto ≥ 60) */
  function riesgo(n) { return Math.round(n * 100 / 7); }
  function nivel(n) { return n >= 5 ? "critico" : (n >= 3 ? "moderado" : "preventivo"); }
  /* Los dos puntos principales: los primeros expuestos según el orden fijo del perfil */
  function principales(AD, perfilId, resps) {
    var orden = AD.orden[variante(AD, perfilId)], out = [];
    for (var i = 0; i < orden.length && out.length < 2; i++) {
      var p = AD.preguntas[orden[i] - 1];
      if (expuesta(p, resps[orden[i] - 1])) out.push(orden[i]);
    }
    return out;
  }
  function otros(AD, perfilId, resps) {
    var pri = principales(AD, perfilId, resps), out = [];
    for (var i = 0; i < AD.preguntas.length; i++) {
      var id = AD.preguntas[i].id;
      if (expuesta(AD.preguntas[i], resps[i]) && pri.indexOf(id) < 0) out.push(id);
    }
    return out;
  }

  function llamado(perfilId, niv, antesDelCorte, packDisponible) {

      return { bloque: "M", pack: !!packDisponible && niv !== "preventivo", sugerido: !!packDisponible && niv === "critico" };
    }

    return { bloque: "RC", lineaMC: false };
  }
  function resumen(AD, perfilId, resps) {
    var n = puntos(AD, resps);

  }

    var e = $("e-" + campo), inp = $("f-" + campo);
    if (e) { e.textContent = msg || ""; e.hidden = !msg; }
    if (inp) { inp.setAttribute("aria-invalid", msg ? "true" : "false"); if (msg) inp.setAttribute("aria-describedby", "e-" + campo); else inp.removeAttribute("aria-describedby"); }
    return msg ? campo : null;
  }
  function enviar() {
    var v = function (id) { var el = $("f-" + id); return el ? el.value.replace(/\s+/g, " ").trim() : ""; };
    var d = { nombre: v("nombre"), profesion: v("profesion"), centro: v("centro"), correo: v("correo").toLowerCase(), whatsapp: v("whatsapp"), novedades: $("f-novedades").checked };
    var digitos = d.whatsapp.replace(/\D/g, "");
    var malos = [
      error("nombre", d.nombre.length < 2 ? "Escribe tu nombre para mostrarte el resultado." : ""),
      error("profesion", !d.profesion ? "Elige tu profesión o especialidad." : ""),
      $("f-centro") ? error("centro", (S.perfil === "centro" && d.centro.length < 2) ? "Escribe el nombre del centro." : "") : null,
      error("correo", !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(d.correo) ? "Revisa tu correo: falta algo, como la @ o el dominio." : ""),
      error("whatsapp", (d.whatsapp && digitos.length < 8) ? "Revisa el número: debe tener al menos 8 dígitos. O déjalo vacío." : ""),
      error("consent", !$("f-consent").checked ? "Marca la casilla del aviso de privacidad para continuar." : "")
    ].filter(Boolean);
    if (malos.length) { var el = $("f-" + malos[0]); if (el) el.focus(); return; }
    S.datos = d;
    var carga = { v: AD.version, perfil: S.perfil, r: S.r.slice(), nombre: d.nombre, profesion: d.profesion, centro: d.centro, correo: d.correo, whatsapp: d.whatsapp, novedades: d.novedades, consentimiento: true, origen: CFG.origen, ms: Date.now() - S.t0, web: $("f-web").value };
    S.id = null;
    pintarResultado(true);
    mostrar("p-resultado");
    servidor("registrar", carga, function (x) {
      if (x && x.id) { S.id = x.id; vaciarCola(); }
      if (!x || x.ok === false) sinCopia();
      else if (x.copia === "pendiente") notaCopia("Tu copia por correo puede tardar unas horas en llegar. Tu resultado completo está en esta pantalla.");
    }, sinCopia);
  }
  function notaCopia(texto) {
    var n = $("nota-copia");
    if (n) { n.hidden = false; n.textContent = texto; }
  }
  function sinCopia() {
    notaCopia("No pudimos enviarte la copia por correo. Tu resultado está en esta pantalla; si quieres la copia, escríbenos a " + AD.correo + ".");
  }

  /* ---------- Resultado ---------- */
  function tarjeta(id, v, tapar) {
    var p = AD.preguntas[id - 1], t = p.tarjeta[v], ciego = S.r[id - 1] === "ns";
    return '<article class="punto"><span class="tag' + (ciego ? " ciego" : "") + '">' + esc(ciego ? AD.resultado.ciego : AD.resultado.brecha) + '</span>' +
      '<h3><span class="rev-t">' + esc(t.titulo) + (tapar ? '<span class="tapa cubre" aria-hidden="true"></span>' : '') + '</span></h3>' +
      (ciego ? '<p class="ciego-t">' + esc(AD.resultado.ciegoTexto) + '</p>' : '') +
      '<p>' + esc(t.texto) + '</p><p class="norma">' + esc(p.tarjeta.norma) + '</p></article>';
  }
  function zonaReserva(prod, etiqueta, principal) {
    var L = AD.llamados, clase = principal ? "btn btn-claro" : "btn btn-borde";
    if (CFG.reserva === "instagram") {
      return '<a class="' + clase + '" href="' + esc(AD.instagram) + '" target="_blank" rel="noopener" data-evlink="reserva_' + prod + '">' + esc(etiqueta) + '</a><p class="chica">' + esc(L.reserva.instagram) + '</p>';
    }
    return '<div class="reserva" data-prod="' + prod + '">' +
      '<button class="' + clase + '" type="button" data-reservar>' + esc(etiqueta) + '</button>' +
      '<div class="conf" hidden><p>' + fmt(L.reserva.confirmar, { correo: S.datos.correo, precio: AD.productos[prod].precio }) + '</p>' +
      '<button class="btn btn-claro" type="button" data-si>' + esc(L.reserva.si) + '</button><button class="lnk" type="button" data-no>' + esc(L.reserva.no) + '</button></div>' +
      '<p class="hecho" hidden>' + fmt(L.reserva.listo, { correo: S.datos.correo }) + '</p></div>';
  }
  function botonReunion(etiqueta) {
    if (CFG.agendaUrl) return '<a class="btn btn-claro" href="' + esc(CFG.agendaUrl) + '" target="_blank" rel="noopener" data-evlink="agenda_clic">' + esc(etiqueta) + '</a>';
    return '<button class="btn btn-claro" type="button" data-ev="reunion">' + esc(etiqueta) + '</button>';
  }
  function bloqueLlamado(res, pf) {
    var ll = Logica.llamado(pf.id, res.nivel, antesDelCorte(), hayPack()), L = AD.llamados, h = '<section class="cta" aria-label="Siguiente paso">';
    if (ll.bloque === "M") {
      h += '<h2>' + esc(L.M.titulo) + '</h2><p>' + esc(L.M.texto) + '</p>' + zonaReserva("mc", L.M.boton, true);
      if (ll.pack) h += '<div class="pack">' + (ll.sugerido ? '<span class="chip">' + esc(L.M.sugerido) + '</span>' : '') + '<p>' + esc(L.M.pack) + '</p>' + zonaReserva("pack", L.M.botonPack, false) + '</div>';
      h += CFG.agendaUrl ? '<a class="lnk" href="' + esc(CFG.agendaUrl) + '" target="_blank" rel="noopener" data-evlink="agenda_clic">' + esc(L.M.secundario) + '</a>' : '<button class="lnk" type="button" data-ev="reunion">' + esc(L.M.secundario) + '</button>';
    } else if (ll.bloque === "RC") {
      h += '<h2>' + esc(L.RC.titulo) + '</h2><p>' + esc(L.RC.texto) + '</p>' + botonReunion(L.RC.boton) + '<p class="chica">' + esc(L.RC.letra) + '</p>';
      if (ll.lineaMC) h += '<div class="pack"><p>' + esc(L.RC.lineaMC) + '</p>' + zonaReserva("mc", L.RC.botonMC, false) + '</div>';
    } else {
      h += '<h2>' + esc(L.RI.titulo) + '</h2><p>' + esc(L.RI.texto) + '</p>' + botonReunion(L.RI.boton) + '<button class="lnk" type="button" data-ev="espera">' + esc(L.RI.secundario) + '</button>';
    }
    return h + '<p class="hecho" id="h-reunion" hidden>' + fmt(L.reunion.listo, { correo: S.datos.correo }) + '</p><p class="hecho" id="h-espera" hidden>' + fmt(L.espera.listo, { correo: S.datos.correo }) + '</p></section>';
  }
  function enlaceTest() { return CFG.url || "[enlace del test]"; }
  function pintarResultado(animar) {
    var res = Logica.resumen(AD, S.perfil, S.r), pf = Logica.perfil(AD, S.perfil), v = pf.variante, R = AD.resultado;
    var lectura = res.puntos === 0 ? AD.lecturas[v].cero : AD.lecturas[v][res.nivel];
    var nombre = S.datos.nombre.split(" ")[0];
    var h = '<header class="cab">' + logo(false) + '</header>' +
      '<div class="res-cab" data-nivel="' + res.nivel + '">' +
        '<p class="eyebrow">' + esc(R.etiqueta) + '</p>' +
        '<h1 class="res-t" data-foco>' + fmt(R.encabezado, { nombre: nombre }) + '</h1>' +
        '<div><span class="nivel-n">' + esc(AD.niveles[res.nivel].nombre) + (animar ? '<span class="tapa cubre" aria-hidden="true"></span>' : '') + '</span></div>' +
        '<div class="tramos" aria-hidden="true"><i class="tp"></i><i class="tm"></i><i class="tc"></i></div>' +
        '<div class="tr-etq" aria-hidden="true"><span>Preventivo</span><span>Moderado</span><span>Crítico</span></div>' +
        '<p class="cuenta">' + fmt(R.cuenta, { n: res.puntos }) + '</p>' +
      '</div>' +
      '<p class="lectura">' + esc(lectura) + '</p>';
    if (res.principales.length) {
      h += '<h2 class="sub">' + esc(res.principales.length === 2 ? R.dos : R.uno) + '</h2>';
      res.principales.forEach(function (id) { h += tarjeta(id, v, animar); });
    }
    if (res.otros.length) {
      h += '<div class="otros"><h2 class="sub chico">' + esc(R.otros) + '</h2><ul>';
      res.otros.forEach(function (id) { h += '<li>' + esc(AD.preguntas[id - 1].tarjeta[v].titulo) + '</li>'; });
      h += '</ul></div>';
    }
    h += '<p class="aclara">' + esc(R.aclaracion) + '</p>' + bloqueLlamado(res, pf) +
      '<div class="comp"><p><b>' + esc(R.compartir) + '</b></p><div class="fila">' +
        '<a class="btn btn-borde" href="https://wa.me/?text=' + encodeURIComponent(R.compartirTexto + " " + enlaceTest()) + '" target="_blank" rel="noopener" data-evlink="compartir">Por WhatsApp</a>' +
        '<button class="btn btn-borde" type="button" data-copiar>Copiar enlace</button></div><p class="hecho" id="h-comp" hidden></p></div>' +
      '<p class="cierre">' + esc(R.cierre) + '</p>' +
      '<p class="letra2">' + fmt(R.letra, { correo: S.datos.correo }) + ' ' + esc(R.notaNormas) + '</p><p class="letra2" id="nota-copia" hidden></p>';
    var cont = $("p-resultado");
    cont.innerHTML = h;
    if (animar) {
      var tapas = cont.querySelectorAll(".cubre");
      Array.prototype.forEach.call(tapas, function (t, n) { setTimeout(function () { t.className += " fuera"; }, 350 + n * 320); });
    }
  }
  $("p-resultado").addEventListener("click", function (ev) {
    var t = ev.target, zona;
    if (!t || !t.getAttribute) return;
    if (t.hasAttribute("data-reservar")) { zona = t.parentNode; zona.querySelector(".conf").hidden = false; t.hidden = true; zona.querySelector("[data-si]").focus(); return; }
    if (t.hasAttribute("data-no")) { zona = t.parentNode.parentNode; zona.querySelector(".conf").hidden = true; zona.querySelector("[data-reservar]").hidden = false; return; }
    if (t.hasAttribute("data-si")) { zona = t.parentNode.parentNode; zona.querySelector(".conf").hidden = true; zona.querySelector(".hecho").hidden = false; evento("reserva_" + zona.getAttribute("data-prod")); return; }
    if (t.hasAttribute("data-ev")) { var tipo = t.getAttribute("data-ev"); t.hidden = true; var hh = $("h-" + tipo); if (hh) hh.hidden = false; evento(tipo); return; }
    if (t.hasAttribute("data-evlink")) { evento(t.getAttribute("data-evlink")); return; }
    if (t.hasAttribute("data-copiar")) {
      var u = enlaceTest(), hc = $("h-comp"), listo = function () { hc.hidden = false; hc.textContent = "Enlace copiado."; }, manual = function () { hc.hidden = false; hc.textContent = "Copia este enlace: " + u; };
      evento("compartir");
      try { navigator.clipboard.writeText(u).then(listo, manual); } catch (e) { manual(); }
    }
  });


  pintarInicio();
  if (CFG.api && window.fetch) {                                       // ajustes vigentes (corte, cupos, reserva, agenda)
    fetch(CFG.api + "?api=cfg").then(function (x) { return x.json(); }).then(function (x) {
      ["corte", "packDisponible", "agendaUrl", "reserva"].forEach(function (k) { if (x && x[k] !== undefined) CFG[k] = x[k]; });
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
